<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exams — NovaQuiz</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/exams.css">
</head>
<body>
<div class="page-loader" aria-hidden="true"><div class="loader-ring"></div></div>

<header class="navbar">
  <div class="container nav-inner">
    <a href="index.html" class="nav-logo"><span class="logo-dot"></span>NovaQuiz</a>
    <nav class="nav-links" aria-label="Primary">
      <a href="index.html" data-page="index.html">Home</a>
      <a href="about.html" data-page="about.html">About</a>
      <a href="dashboard.html" data-page="dashboard.html">Dashboard</a>
      <a href="exams.html" data-page="exams.html">Exams</a>
      <a href="contact.html" data-page="contact.html">Contact Us</a>
    </nav>
    <div class="nav-actions">
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark and light mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <a href="login.html" class="btn btn-ghost" data-nav="login">Login</a>
      <a href="signup.html" class="btn btn-primary btn-sm" data-nav="signup">Sign Up</a>
    </div>
    <button class="nav-burger" aria-label="Toggle menu" aria-expanded="false"><span></span></button>
  </div>
</header>

<main>
  <section class="page-header">
    <div class="container">
      <span class="eyebrow" style="justify-content:center;">Exam Library</span>
      <h1>Find your next mock exam</h1>
      <p>Search or filter by subject, then start practicing instantly — no downloads, no sign-up required for a preview.</p>
    </div>
  </section>

  <section class="container" style="padding-bottom:90px;">
    <div class="exam-toolbar glass reveal">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" placeholder="Search exams by subject or category..." data-exam-search aria-label="Search exams">
      </div>
      <div class="filter-chips">
        <button class="chip active" data-category="All">All</button>
        <button class="chip" data-category="Mathematics">Mathematics</button>
        <button class="chip" data-category="Science">Science</button>
        <button class="chip" data-category="English">English</button>
        <button class="chip" data-category="Computer Science">Computer Science</button>
        <button class="chip" data-category="History">History</button>
        <button class="chip" data-category="Geography">Geography</button>
      </div>
    </div>

    <div class="grid grid-3" data-exam-grid></div>
  </section>
</main>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">
      <span>© 2026 NovaQuiz. All rights reserved.</span>
      <span><a href="index.html" style="color:var(--text-dim)">Back to Home</a></span>
    </div>
  </div>
</footer>

<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/exams.js"></script>
</body>
</html>
