<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — NovaQuiz</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="page-loader" aria-hidden="true"><div class="loader-ring"></div></div>

    <header class="navbar">
        <div class="container nav-inner">
            <a href="index.html" class="nav-logo"><span class="logo-dot"></span>NovaQuiz</a>
            <nav class="nav-links" aria-label="Primary">
                <a href="index.html" data-page="index.html">Home</a>
                <a href="about.html" data-page="about.html">About</a>
                <a href="dashboard.html" data-page="dashboard.html">Dashboard</a>
                <a href="exams.html" data-page="exams.html">Exams</a>
                <a href="contact.html" data-page="contact.html">Contact Us</a>
            </nav>
            <div class="nav-actions">
                <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark and light mode">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" /></svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" /></svg>
                </button>
                <a href="login.html" class="btn btn-ghost" data-nav="login">Login</a>
            </div>
            <button class="nav-burger" aria-label="Toggle menu" aria-expanded="false"><span></span></button>
        </div>
    </header>

    <main class="auth-wrap">
        <div class="glass auth-card wide reveal in">
            <div class="auth-head">
                <span class="logo-dot" style="display:inline-block; margin-bottom:14px;"></span>
                <h1>Create your account</h1>
                <p>Start practicing with NovaQuiz — free forever.</p>
            </div>

            <form id="signupForm" novalidate>
                <div class="form-row">
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" placeholder="Jane Doe" autocomplete="name">
                        <span class="field-hint"></span>
                    </div>
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="janedoe" autocomplete="username">
                        <span class="field-hint"></span>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="suEmail">Email</label>
                        <input type="email" id="suEmail" placeholder="you@example.com" autocomplete="email">
                        <span class="field-hint"></span>
                    </div>
                    <div class="form-group">
                        <label for="mobile">Mobile Number</label>
                        <input type="tel" id="mobile" placeholder="9876543210" autocomplete="tel">
                        <span class="field-hint"></span>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group password-field">
                        <label for="suPassword">Password</label>
                        <input type="password" id="suPassword" placeholder="••••••••" autocomplete="new-password">
                        <span class="field-hint"></span>
                        <div class="strength-bar"><div class="strength-bar-fill"></div></div>
                        <span class="strength-label"></span>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password">
                        <span class="field-hint"></span>
                    </div>
                </div>
                <label class="form-check" style="margin-bottom:20px;">
                    <input type="checkbox" id="terms">
                    I agree to the <a href="#" style="color:var(--cyan); margin:0 4px;">Terms &amp; Conditions</a> and Privacy Policy
                </label>
                <button type="submit" class="btn btn-primary btn-block">Create Account</button>
            </form>

            <div class="auth-divider">or sign up with</div>
            <div class="social-row-auth">
                <button class="social-login-btn"><svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.4-1.7 4.2-5.5 4.2-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.9 1.5l2.6-2.5C16.9 3.5 14.7 2.5 12 2.5 6.8 2.5 2.6 6.7 2.6 12S6.8 21.5 12 21.5c6.9 0 9.3-4.9 9.3-7.4 0-.5 0-.9-.1-1.3H12z" /></svg>Google</button>
                <button class="social-login-btn"><svg viewBox="0 0 24 24" fill="#1877F2"><path d="M13.5 21v-8h2.7l.4-3.2h-3V7.7c0-.9.3-1.5 1.6-1.5H17V3.4c-.3 0-1.2-.1-2.3-.1-2.4 0-4 1.5-4 4.1v2.4H8v3.2h2.7V21z" /></svg>Facebook</button>
            </div>

            <p class="auth-footer-text">Already have an account? <a href="login.html">Log in</a></p>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
