<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam in Progress — NovaQuiz</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/exams.css">
</head>
<body>
<div class="page-loader" aria-hidden="true"><div class="loader-ring"></div></div>

<header class="navbar">
  <div class="container nav-inner">
    <a href="index.html" class="nav-logo"><span class="logo-dot"></span>NovaQuiz</a>
    <nav class="nav-links" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="exams.html">Exams</a>
      <a href="dashboard.html">Dashboard</a>
    </nav>
    <div class="nav-actions">
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark and light mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
    </div>
    <button class="nav-burger" aria-label="Toggle menu" aria-expanded="false"><span></span></button>
  </div>
</header>

<main class="exam-shell container">
  <div class="exam-topbar glass">
    <div class="exam-name" data-exam-title>Exam
      <span data-exam-sub>Loading...</span>
    </div>
    <div class="timer-display">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <span data-timer>00:00</span>
    </div>
  </div>

  <div class="progress-strip"><div class="progress-strip-fill" data-progress-fill style="width:0%"></div></div>

  <div class="question-card glass" role="group" aria-label="Question">
    <div class="q-index" data-q-index>Question 1</div>
    <div class="q-text" data-q-text></div>
    <div class="option-list" data-option-list role="radiogroup"></div>
  </div>

  <div class="q-jump" data-q-jump aria-label="Jump to question"></div>

  <div class="exam-nav">
    <button class="btn btn-outline" data-prev>← Previous</button>
    <button class="btn btn-primary" data-next>Next →</button>
    <button class="btn btn-primary" data-submit style="display:none;">Submit Exam ✓</button>
  </div>
</main>

<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/timer.js"></script>
<script src="js/exams.js"></script>
</body>
</html>
