<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Result — NovaQuiz</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/exams.css">
</head>
<body>
<div class="page-loader" aria-hidden="true"><div class="loader-ring"></div></div>

<header class="navbar">
  <div class="container nav-inner">
    <a href="index.html" class="nav-logo"><span class="logo-dot"></span>NovaQuiz</a>
    <nav class="nav-links" aria-label="Primary">
      <a href="index.html" data-page="index.html">Home</a>
      <a href="about.html" data-page="about.html">About</a>
      <a href="dashboard.html" data-page="dashboard.html">Dashboard</a>
      <a href="exams.html" data-page="exams.html">Exams</a>
      <a href="contact.html" data-page="contact.html">Contact Us</a>
    </nav>
    <div class="nav-actions">
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark and light mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <a href="login.html" class="btn btn-ghost" data-nav="login">Login</a>
      <a href="signup.html" class="btn btn-primary btn-sm" data-nav="signup">Sign Up</a>
    </div>
    <button class="nav-burger" aria-label="Toggle menu" aria-expanded="false"><span></span></button>
  </div>
</header>

<main class="container" style="max-width:820px; padding-bottom:90px;" data-result-wrap>

  <div class="glass result-hero reveal in">
    <div class="result-ring-wrap">
      <svg viewBox="0 0 180 180">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#7C6FF0"/>
            <stop offset="100%" stop-color="#4FD1C5"/>
          </linearGradient>
        </defs>
        <circle class="result-ring-bg" cx="90" cy="90" r="82"/>
        <circle class="result-ring-fill" cx="90" cy="90" r="82"/>
      </svg>
      <div class="result-ring-label"><span class="pct">0%</span><span class="lbl">Score</span></div>
    </div>
    <div class="result-title" data-result-title>Loading result...</div>
    <div class="result-sub" data-result-sub></div>
  </div>

  <div class="result-stats reveal in">
    <div class="result-stat glass"><div class="val" data-stat-score>0/0</div><div class="lbl">Total Score</div></div>
    <div class="result-stat glass"><div class="val green" data-stat-correct>0</div><div class="lbl">Correct Answers</div></div>
    <div class="result-stat glass"><div class="val red" data-stat-wrong>0</div><div class="lbl">Wrong Answers</div></div>
    <div class="result-stat glass"><div class="val gold" data-stat-time>00:00</div><div class="lbl">Time Taken</div></div>
  </div>

  <div class="flex gap-12" style="justify-content:center; margin-bottom:40px;">
    <a href="exams.html" class="btn btn-outline">Browse More Exams</a>
    <a href="exam.html" data-retake class="btn btn-primary">Retake This Exam</a>
  </div>

  <h2 style="font-size:1.3rem; margin-bottom:18px;">Answer Review</h2>
  <div data-review-list></div>
</main>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">
      <span>© 2026 NovaQuiz. All rights reserved.</span>
      <span><a href="index.html" style="color:var(--text-dim)">Back to Home</a></span>
    </div>
  </div>
</footer>

<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/result.js"></script>
</body>
</html>
